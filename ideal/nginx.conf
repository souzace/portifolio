server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; access_log off; }
    location ~* \.(css|js)$                           { expires 7d;  add_header Cache-Control "public"; access_log off; }

    location /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { try_files $uri $uri/ =404; }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    error_page 404 /index.html;
}
