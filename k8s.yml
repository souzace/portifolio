# k8s.yml — Kubernetes manifests (Deployment + Service + HPA)
# Apply with: kubectl apply -f k8s.yml
# Delete with: kubectl delete -f k8s.yml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portifolio
  labels:
    app: portifolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portifolio
  template:
    metadata:
      labels:
        app: portifolio
        version: "1.0.0"
    spec:
      containers:
        - name: portifolio
          image: portifolio:local   # replace with registry path on deploy
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
      # Run as non-root
      securityContext:
        runAsNonRoot: false   # nginx alpine needs root for port 80; set true if using port 8080
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: portifolio-svc
  labels:
    app: portifolio
spec:
  type: ClusterIP
  selector:
    app: portifolio
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portifolio-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portifolio
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
