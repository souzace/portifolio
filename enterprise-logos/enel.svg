<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="24" fill="#141416"/>
  <circle cx="60" cy="60" r="48" fill="#1d1e22"/>
  <!-- Enel Cursor / Rainbow Arc -->
  <g transform="translate(60,60)">
    <!-- Arc 1: Red/Orange -->
    <path d="M-18 -26 A32 32 0 0 1 24 -16" fill="none" stroke="#ff3a2d" stroke-width="6" stroke-linecap="round"/>
    <!-- Arc 2: Magenta/Pink -->
    <path d="M24 -16 A32 32 0 0 1 28 14" fill="none" stroke="#e6007e" stroke-width="6" stroke-linecap="round"/>
    <!-- Arc 3: Purple/Blue -->
    <path d="M28 14 A32 32 0 0 1 -4 28" fill="none" stroke="#7928ca" stroke-width="6" stroke-linecap="round"/>
    <!-- Arc 4: Cyan/Green -->
    <path d="M-4 28 A32 32 0 0 1 -28 6" fill="none" stroke="#00c853" stroke-width="6" stroke-linecap="round"/>
    <!-- Enel cursor pointer -->
    <polygon points="-6,-6 14,0 4,8 0,16" fill="#ffffff"/>
  </g>
</svg>
