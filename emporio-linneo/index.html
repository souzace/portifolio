<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empório Linneo - Padaria e Confeitaria</title>
    <!-- Fontes que remetem a tradição e modernidade -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-content">
            <a href="#" class="logo-link">
                <img src="logomark.jpg" alt="Empório Linneo" class="logo-img">
            </a>
            <div class="header-actions">
                <a href="#cardapio" class="nav-link">Cardápio</a>
                <a href="#encomendas" class="btn-primary">Fazer Pedido</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1>O aroma fresco da tradição, todos os dias.</h1>
            <p>Pães de fermentação natural, doces artesanais e aquele café perfeito para acompanhar o seu momento.</p>
            <div class="hero-buttons">
                <a href="#encomendas" class="btn-primary">Pedir Delivery</a>
                <a href="#visite" class="btn-outline">Conheça nosso espaço</a>
            </div>
        </div>
    </section>

</html>
