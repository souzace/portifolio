services:
  db:
    image: mariadb:10.6
    container_name: kuroneko_woo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kuroneko_root_pass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: kuroneko_user
      MYSQL_PASSWORD: kuroneko_pass
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.4-apache
    container_name: kuroneko_woo_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8087:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: kuroneko_user
      WORDPRESS_DB_PASSWORD: kuroneko_pass
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:
